# What a pull request gets. The docker workflow only runs on push to main,
# so without this a contribution would be merged unbuilt — and Dependabot's
# own pull requests would arrive with nothing checking them.
#
# The trigger is `pull_request`, never `pull_request_target`: the latter
# runs the BASE branch's workflows against a fork's code with a writable
# token and access to secrets, which is the classic way a public repository
# leaks. On `pull_request` a fork runs with a read-only token and no
# secrets, which is why nothing here logs in or pushes anywhere.
name: ci

on:
  pull_request:
  workflow_dispatch:

# A second push to a pull request makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - name: darwin build
        # `chromemcp node` runs on a Mac (README: Nodes), which none of the
        # images are; keep it compiling there.
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go vet ./... && go build -o /dev/null .
      - name: go test
        # The integration tests drive a real Chrome against the image's own
        # fonts and an Xvnc, neither of which a bare runner has — the device
        # profile would be measured against the wrong machine. They run in
        # the image build instead, which is what the `image` job exercises.
        env:
          CHROMEMCP_TEST_NO_CHROME: "1"
        run: go test ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          # Reads the cache the main branch filled and writes none of its
          # own: a pull request should not be able to put anything into the
          # cache that a later build on main would pick up.
          cache-from: type=gha,scope=linux/amd64
